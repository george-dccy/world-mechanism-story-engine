id: H01-standard-time
version: "0.3"
status: review

source_domain:
  - history
  - technology
  - society

question:
  surface: "一张车票上的14:37，为什么所有人都默认它只有一个意思？"
  core: "为什么现代社会需要让陌生人共享同一个未来时间坐标？"
  why_i_care: "标准时间看起来像自然事实，但它真正解决的是跨地点协作中的共同预期。"

mechanism:
  one_sentence_model: "标准时间真正标准化的不是太阳，而是陌生人对‘未来什么时候发生什么’的共同预期。"
  actors:
    - "普通出行者"
    - "车站与交通系统"
    - "异地家人和协作者"
    - "铁路及其他跨地点网络"
    - "公共时间标准"
  forces:
    - "地方太阳时间差异"
    - "跨城协作"
    - "时刻表对未来事件的共同承诺"
    - "标准的网络效应"
  feedback_loops:
    - "跨地点协作越密集 -> 本地时间换算成本越高 -> 统一标准越有价值 -> 更多系统依赖统一标准"
  evidence_status:
    facts:
      - "1883年前北美许多城镇使用地方太阳时间。"
      - "1880年代铁路系统曾并行使用约50套区域时间。"
      - "1883-11-18北美铁路切换到Standard Railway Time。"
      - "部分地方在切换日经历local noon与standard noon两个正午。"
      - "1918年美国才通过联邦Standard Time Act。"
    interpretations:
      - "标准时间的核心价值是降低跨地点协作中的时间转换和协调成本。"
      - "时刻表把未来事件转化为陌生人可共享的时间坐标。"
    hypotheses:
      - "观众通过现代车票和异地协作，比通过19世纪职业更容易理解这层机制。"

creative_hypothesis:
  operation: "Remove + Modern Reframe"
  changed_rule: "假设现代社会明天重新允许每座城市按本地太阳时间生活，再观察跨城车票、接站、会议和物流会怎样增加转换成本。"
  why_this_reveals_the_mechanism: "先让观众失去共享时间，才能重新看见一张普通车票背后的协调协议。"

world:
  rule: "反事实只取消跨城市共享的标准时间，不改变物理上的太阳运动。"
  invariant: "历史事实与现代反事实严格分层。"
  forbidden_shortcuts:
    - "不把时区与真太阳时混成同一概念"
    - "不把1883铁路采用写成联邦政府命令"
    - "不把过去写成愚昧"
    - "不把现代统一时间写成没有代价的单向进步"

human_stakes:
  ordinary_life_change: "跨城出行、接站、远程会议、直播和物流都需要额外说明时间基准。"
  who_adapts_first: "高度依赖跨地点协作的人和系统。"
  who_pays_cost: "需要不断换算、却无法要求所有人统一标准的人。"

content_progression:
  - "一张车票上的14:37为什么看起来如此自然"
  - "假设每座城市重新按自己的太阳时间生活"
  - "最先出问题的不是钟，而是跨城承诺"
  - "回到19世纪：真实世界曾长期存在大量地方时间"
  - "1883标准铁路时间让多个地点开始共享未来坐标"
  - "重新看车票：14:37其实是一份社会协议"

knowledge_payload:
  child_layer:
    - "以前不同地方的钟可以不一样。"
    - "交通和通信让很多地方越来越需要一起认同同一个时间。"
    - "车票上的时间是一种让陌生人合作的标准。"
  adult_layer:
    - "基础设施越成功，越容易被人当成自然事实。"
    - "标准化真正创造的是可互操作的未来承诺。"
  optional_afterword:
    - "补充local solar time、1883铁路标准时间和1918联邦立法的区别。"

expression:
  primary_mode: "modern-counterfactual-explainer"
  renderer_candidates:
    - "article"
    - "story-film"
    - "whiteboard"
    - "archive-collage"
    - "hybrid"
  must_preserve:
    - "共享未来坐标是主机制"
    - "现代体验先行，历史解释后置"
    - "1883与1918边界"
    - "事实与反事实分层"
    - "不做单向进步叙事"
  may_change:
    - "车票是否改成航班 / 日历邀请"
    - "具体跨城场景"
    - "媒介和篇幅"

creator_notes:
  what_surprised_me: "车票上的时间并不只是描述未来，而是在组织未来。"
  what_i_am_not_sure_about: "现代反事实需要控制概念复杂度，避免陷入真太阳时技术细节。"
  what_i_refuse_to_simplify: "不把它写成‘以前时间很乱，所以发明了时区’。"
