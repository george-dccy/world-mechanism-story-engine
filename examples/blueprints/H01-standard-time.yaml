id: H01-standard-time
version: "0.2"
status: review

source_domain:
  - history
  - technology
  - society

question:
  surface: "为什么大家不能各自按太阳看时间？"
  core: "什么时候‘当地几点’不再只是当地人的事，而开始变成整个网络必须共同回答的问题？"
  why_i_care: "它让一个看似天然的日常事实重新显出背后的协调协议。"

mechanism:
  one_sentence_model: "标准时间真正标准化的不是太阳，而是陌生人对‘未来什么时候发生什么’的共同预期。"
  actors:
    - "城镇居民"
    - "铁路公司"
    - "旅客与商人"
    - "天文台与电报网络"
    - "城市与后来的政府"
  forces:
    - "地方太阳时间差异"
    - "铁路跨地点调度"
    - "时刻表对未来事件的共同承诺"
    - "电报远距离同步"
    - "公共标准的网络效应"
  feedback_loops:
    - "网络扩大 -> 协调冲突成本上升 -> 更多节点采用统一标准 -> 统一标准价值继续上升"
  evidence_status:
    facts:
      - "1883年前北美存在大量地方太阳时间。"
      - "1880年代铁路系统曾并行使用约50套区域时间。"
      - "1883-11-18北美铁路切换到Standard Railway Time。"
      - "部分地方在切换日经历local noon与standard noon两个正午。"
      - "1918年美国才通过联邦Standard Time Act。"
      - "1883切换时天文台使用电报发送同步时间信号。"
    interpretations:
      - "铁路安全是推动力之一，但更广的机制是跨地点网络的协调成本。"
      - "统一时间把‘下午三点’变成跨地点共享的未来坐标。"
    hypotheses:
      - "当共享标准足够普及时，人们会逐渐把制度协议体验成自然事实。"

creative_hypothesis:
  operation: "Expose"
  changed_rule: "不新增魔法；把1883年真实的‘两个正午’作为制度切换瞬间。"
  why_this_reveals_the_mechanism: "观众可以看到多个本来都合理的本地时间，怎样在跨城网络压力下被一个共享标准重新组织。"

world:
  rule: "历史现实：1883年铁路标准时间开始取代大量地方太阳时间。"
  invariant: "史实与虚构人物必须明确分层。"
  forbidden_shortcuts:
    - "不让虚构人物成为标准时间的发明者"
    - "不把铁路写成唯一原因"
    - "不把地方太阳时间写成错误或愚昧"
    - "不把1883铁路采用与1918联邦立法混为一谈"

human_stakes:
  ordinary_life_change: "约车、换乘、营业、交货和见面开始需要共享同一个未来时间坐标。"
  who_adapts_first: "高度依赖跨地点网络的人和机构。"
  who_pays_cost: "仍按本地时间行动、却进入标准化网络的人。"

story:
  protagonist: "约14岁的虚构电报送信少年"
  relationship: "少年 × 电报局 × 车站 × 城里仍使用不同时间的普通人"
  external_task: "在新标准正午前，把时间切换通知送到几个关键地点。"
  obstacle: "每个地点原本都有自己合理的时间参照和利益。"
  repeated_action: "少年反复问‘现在几点’，每次得到的答案都从本地事实变成协调选择。"
  state_changes:
    - "多种时间原本正常共存"
    - "铁路宣布切换"
    - "不同地点开始选择是否跟随"
    - "第一个正午过去但任务未结束"
    - "第二个正午成为新的铁路参照"
    - "下午的‘三点’第一次被更广网络共同理解"
  ending_image: "少年经过仍指向太阳的本地钟，再看已经统一后的车站钟；两块钟都没有坏。"
  ending_question: "我们今天认为天然的时间，有多少其实是为了让陌生人协作而建立的共同协议？"

knowledge_payload:
  child_layer:
    - "过去不同地方的正午可以不同。"
    - "铁路和电报让远方的人越来越需要对同一个时间。"
    - "时区是一种帮助很多人协作的标准。"
  adult_layer:
    - "基础设施最成功时，常常会被体验成自然事实。"
    - "标准化降低协调成本，也会重新分配地方自主性和规则解释权。"
  optional_afterword:
    - "说明1883铁路采用、两个正午与1918联邦立法的区别。"

expression:
  primary_mode: "historical-story"
  renderer_candidates:
    - "story-film"
    - "archive-collage"
    - "article"
    - "whiteboard"
  must_preserve:
    - "共享未来坐标是主机制"
    - "1883与1918边界"
    - "真实史实与虚构任务分层"
    - "不同立场都有合理性"
    - "不做单向进步叙事"
  may_change:
    - "是否使用真实城市"
    - "具体送信地点"
    - "人物姓名与家庭背景"
    - "媒介和篇幅"

creator_notes:
  what_surprised_me: "时钟不只告诉人‘现在’，时刻表更重要的是让陌生人共同约定‘未来’。"
  what_i_am_not_sure_about: "1883切换日普通城市传播通知的具体操作仍需深研究。"
  what_i_refuse_to_simplify: "不把历史压成‘火车发明了时区’。"
